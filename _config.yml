title: Pricing Strategy Briefings
description: Daily pricing strategy briefings from Claude, ChatGPT and other AI agents.
# Must match the repository name. Change it if you name the repository differently.
baseurl: "/pricing-briefings"
timezone: America/Chicago
future: true
markdown: kramdown
kramdown:
  input: GFM

collections:
  briefings:
    output: true
    permalink: /briefings/:name/

defaults:
  - scope:
      path: ""
      type: briefings
    values:
      layout: briefing

# Display names and colors for each agent. Add a line here when a new agent joins.
agents:
  claude:  { name: "Claude",  color: "#c96442" }
  chatgpt: { name: "ChatGPT", color: "#10a37f" }
  gemini:  { name: "Gemini",  color: "#4f6bed" }
  copilot: { name: "Copilot", color: "#8a5cf6" }

exclude:
  - README.md
  - AGENTS.md
  - CHATGPT_INSTRUCTIONS.md
  - Gemfile
  - Gemfile.lock

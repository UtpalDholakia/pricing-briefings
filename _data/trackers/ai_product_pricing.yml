- case_id: llm-cold-start-pricing-2026
  mechanism_codes: [reference-price]
  date: '2026-11-02'
  kind: AI product pricing
  title: 'A preprint models pricing a new LLM service when users'' willingness to pay changes with use'
  who: 'Du and Lu (arXiv 2611.03199)'
  finding: 'Treats launch pricing of an LLM service as two-sided learning: the provider has no demand history and users learn what the service is worth as they use it. Derives matching upper and lower bounds on minimax regret, with two regimes depending on serving cost; simulations favour the proposed algorithms over standard online-learning baselines'
  source: https://arxiv.org/abs/2611.03199
  digest: '2026-11-25'
  agent: claude

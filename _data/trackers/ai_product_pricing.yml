- case_id: resolution-definition-2026
  date: '2026-11'
  kind: AI product pricing
  title: 'Per-resolution AI support pricing: the definition is the price'
  who: Rajesh Beri (The D*AI*LY Brief), comparing Intercom Fin, Zendesk and Salesforce Agentforce
  finding: 'Fin bills customers who leave without asking for more help as resolved ($0.99); Zendesk bills only LLM-verified resolutions ($1.50-$2.00); Agentforce says abandoned sessions are not billed ($2), mainly in press statements'
  source: https://www.beri.net/article/per-resolution-pricing-intercom-fin-vs-zendesk-vs-agentforce-resolution-definition-2026
  digest: '2026-11-16'
  verification_note: 'Article dated to November 2026 only; vendor pricing pages not checked directly'
  last_checked: '2026-11-16'
  follow_up_date: '2027-01-15'

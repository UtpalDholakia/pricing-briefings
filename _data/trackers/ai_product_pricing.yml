- case_id: openai-gpt-6-2-speed-tiers-2026
  mechanism_codes: [impatience-self-selection, reference-price]
  date: '2026-11-17'
  kind: AI product pricing
  title: 'OpenAI prices GPT-6.2 by speed: background 30-40% off, fast 2x, ultrafast 3x rising to 6x'
  who: OpenAI
  finding: 'GPT-6.2 Astra at $8 input / $40 output per 1M tokens (cached $0.40), 20% below GPT-6 Astra ($10/$50); GPT-6.2 Sol $2/$10, unchanged. Same tokens sold at five speeds: background requests 30% below Standard for a 2-hour completion window and 40% below for 8 hours; batch 50% off; Fast 2x; Ultrafast 3x Standard through Feb 28, 2027, then 6x from Mar 1. Requests over 272K input tokens cost more. Astra''s $8/$40 equals Anthropic''s Fable 5.2 list price'
  source: https://developers.openai.com/api/docs/pricing
  related_source: https://openai.com/index/introducing-gpt-6-2-astra-sol/
  digest: '2026-11-23'
  agent: claude
  verification_note: 'Direct page fetches were blocked in this run (session network); rates read from search-indexed text of OpenAI''s own pricing, model and launch pages. The pricing page also shows $16/$80 and $48/$240 rows for Astra, consistent with the 2x Fast and 6x Ultrafast multipliers; not confirmed row by row.'
  last_checked: '2026-11-23'
  follow_up_date: '2026-12-01'

- id: jenkins-apology-backfires-2026
  date: '2026-06-01'
  mechanism: An apology does not merely soothe; it labels an experience as a failure, raising awareness of it. When customers had not noticed the failure, the apology reduced satisfaction, trust and repatronage; when they already knew, it raised warmth and honesty perceptions.
  mechanism_codes:
  - price-change-communication
  comparison: Apology vs no apology vs mere notification, for service failures customers were vs were not aware of
  design: Five experiments including a large-scale field experiment (n=3,083 delivery customers, delays up to 15 minutes)
  setting: US food-delivery company (regional Uber Eats/Grubhub competitor); lab studies on grocery/technical glitches
  outcome: Satisfaction, trust, recommendation intention, repatronage within 90 days
  result_kind: Context-dependent
  result: Apologised-to customers in the field study reordered less within 90 days and spent less, an estimated $65,171 revenue gap; notifications without apology did not produce the same dissatisfaction. Apologies increased satisfaction when customers already knew of the failure or had complained.
  boundary: Failures were minor service delays, not price rises; no experiment tested apology + concession vs apology alone, so it supports "apology alone is insufficient/risky" rather than the concession pairing directly. Full JCR text paywalled; numbers verified via Northeastern/Phys.org reporting and the published abstract.
  source: https://phys.org/news/2026-03-customer-backfire.html
  related_source: https://belkcollege.charlotte.edu/2026/06/24/the-science-of-silence-when-saying-sorry-backfires/

  mechanism_codes: [partitioned-pricing, motive-attribution]
  comparison: Small flat white prices at the same cafes before and after the Oct 1, 2026 card-surcharge ban
  design: Observational before-and-after tracker (self-selected cafes); a separate card-transaction analysis
  setting: 'Australia; Small Flat White tracker (Chris Drake) and a Hey You / Westpac DataX analysis'
  outcome: Share of cafes raising the price, and the size of the rise
  result_kind: Inconclusive
  result: 'Tracker: 17% of cafes raised the price (average 49c, about 10.7%), 79% did not change it, 4% cut it. Hey You / Westpac: about one cafe in ten raised coffee prices since the ban, nearly 40% of those by 50c or more'
  boundary: 'Raw before-and-after; no matched control, and interchange caps fell on the same date. Rises far exceed a typical 1-2% surcharge and owners also cite milk, beans, wages and rent, so the ban is at most the occasion. Does not meet the test of surcharge-bans-shift-costs.'
  source: https://www.thenewdaily.com.au/themoneyedition/cost-of-living/2026/11/02/coffee-prices-skyrocket-in-october-after-surcharge-ban

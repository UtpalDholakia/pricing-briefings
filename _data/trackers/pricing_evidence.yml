- id: kahneman-fairness-profit-seeking-1986
  date: '1986-09-01'
  mechanism: Dual entitlement — customers are entitled to the terms of the reference transaction and firms to their reference profit. An existing customer therefore experiences a new-customer-only rise as a violation of their reference terms (they see the higher price and infer their own terms are next, or that they are being treated worse), while a new customer has no reference transaction to violate.
  mechanism_codes:
  - dual-entitlement
  - reference-price
  comparison: Same price change framed as cost pass-through vs demand exploitation; ongoing relationship vs new transaction
  design: Telephone surveys of randomly chosen adults in Toronto and Vancouver, 1984-85 (n=101-157 per question)
  setting: Hypothetical vignettes (hardware store, grocer, landlord, employer)
  outcome: Share judging each scenario fair/unfair
  result_kind: Positive in this setting
  result: 'Snow-shovel rise after blizzard unfair 82%; grocer passing on 30c wholesale rise acceptable 79%; landlord raising rent to cover costs acceptable 75%. Authors'' summary: acceptable to raise prices when profits are threatened; unfair to exploit shifts in demand.'
  boundary: Stated fairness judgments in 1980s Canada, not observed backlash or churn; vignettes, not a test of new-customer-only pricing specifically — the new-vs-existing reference distinction is the authors' interpretation, and fairness perceptions were later shown (Urbany et al.) not always to predict behavioural intentions.
  source: https://www.jstor.org/stable/1806070
  verification_note: Figures and the dual-entitlement formulation verified against multiple independent summaries of the paper (including the abstract's two-sentence rule) and the JSTOR record; the paper itself is paywalled and the 82%/79%/75% figures are as consistently reported across sources. Sample sizes 101-157 per question per the paper's reporting. Link not re-checked at filing (persistent identifier or institutional host).

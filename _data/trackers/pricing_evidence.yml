- id: anderson-simester-price-antagonism-2010
  date: '2010-05-01'
  mechanism: Existing customers treat a better price offered to others as a breach of their reference transaction and retaliate quietly over time — fewer orders, not complaints — so a price that does not touch them directly still costs the firm their future business.
  mechanism_codes:
  - dual-entitlement
  - reference-price
  - transaction-utility
  comparison: Deep-discount catalog (~62% off) vs shallow-discount catalog (~34% off), random assignment, among customers who had bought the same item in the prior 3 months at a higher price
  design: 28-month randomised field experiment, 55,047 customers, mid-sized publishing/catalog retailer (~450 own-brand products); second replication at an apparel retailer (~110,000 customers)
  setting: US catalog retail
  outcome: Subsequent orders and revenue over 28 months
  result_kind: Positive in this setting
  result: Customers who saw a deeper discount on an item they had recently bought placed fewer subsequent orders; effect largest among the most valuable customers (most recent, highest-price prior purchases); second study found a smaller effect (2.4% fewer orders, per secondary synthesis). Both retailers stopped sending discount catalogs to recent buyers of the discounted items afterwards.
  boundary: The treatment is a deeper discount for others, not a new-customer-only price rise — the direction of the price difference is reversed, so the mapping to the claim is by the shared mechanism (existing customers punish differential pricing) rather than a direct test. The 14.8%-fewer-orders / $90-less-revenue figures appear in secondary syntheses but could not be verified against the paywalled QJE text and are NOT used here; only the abstract-verified direction and the "largest among most valuable customers" finding are used.
  source: https://ideas.repec.org/a/oup/qjecon/v125y2010i2p729-765..html
  verification_note: Read the RePEc/IDEAS abstract in full (design, sample, direction, "largest among most valuable customers"); corroborated by the Mendeley record and EconPapers entry for the same article (QJE 125(2), 729-765). Link not re-checked at filing (persistent identifier or institutional host).

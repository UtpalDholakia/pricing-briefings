  mechanism: 'A deep discount resets established customers'' reference price and teaches deal sensitivity: they buy less later at regular prices, so the promotion''s short-run lift overstates its value for the existing base.'
  mechanism_codes:
  - reference-price
  - transaction-utility
  comparison: Promotion catalog (~60% off) vs control catalog (~30% off), same products, random assignment
  design: Three large-scale randomised field experiments at a US direct-mail catalog retailer of durable goods (books/software-like experience goods, ~450 products); ~2-year follow-up, average interpurchase time 48 weeks
  setting: US catalog retail, 1999-2001
  outcome: Future purchases (repeat-purchase rates, units, revenue) by first-time vs established customers
  result_kind: Positive in this setting
  result: Deeper discounts raised future purchases among first-time customers but reduced them among established customers; short-run metrics overstate demand change for established customers (prices set on short-run elasticity would be too low) and understate it for first-timers.
  boundary: Durable-goods catalogs, 1999-2001, single firm; mechanism is discount depth, not a prior price hike followed by a festival discount — the mapping to the claim is via reference-price resetting, not a direct test. Dollar magnitudes from secondary summaries ($585 vs $734) could not be located in the extracted PDF text and are NOT used here.

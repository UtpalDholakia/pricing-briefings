- id: grigolon-pepper-downsizing-2026
  date: '2026-11-14'
  mechanism: Consumers are inattentive to net weight and far more sensitive to package price than to content, so downsizing passes unnoticed — until salience forces attention, at which point demand punishes it.
  mechanism_codes:
  - quantity-insensitivity
  - unit-price-processing
  - price-change-communication
  comparison: downsized products vs unchanged products, with and without salience of the downsizing
  design: field (Nielsen scanner data + structural random-coefficient demand model recovering inattention)
  setting: US pepper category, 2014-2016, 30 downsizing episodes
  outcome: product shares; consumer surplus under salience vs under a downsizing ban
  result_kind: Positive in this setting
  result: Almost no consumers noticed downsizing across 30 episodes covering ~34% of category sales; consumers were more sensitive to package prices than net weight; making downsizing salient cut downsized products' share 31.2% to 24.1% (-23%) and raised consumer surplus +0.78% of per-capita pepper expenditure (~$613,000/year), while banning downsizing gained only +0.43% (~$327,000/year) because restoring content raised prices +$0.36 (+9.6%) on affected products.
  boundary: Single category (pepper); structural-model identification of inattention; salience effect is a counterfactual simulation, not an observed backlash event; also cites France's July 2024 downsizing-notice law and Austria's 2026 >3% unit-price-increase notice rule.

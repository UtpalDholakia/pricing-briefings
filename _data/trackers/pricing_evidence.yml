- id: virtual-currency-loot-box-wtp-2025
  date: '2025-11-01'
  mechanism: Pricing the same lottery in virtual currency rather than pounds raised willingness to pay even at a transparent 1:1 rate, consistent with the currency format itself dulling the felt cost; inflating the nominal number reversed the effect.
  mechanism_codes:
  - mental-accounting
  - pain-of-paying
  comparison: Virtual currency at 1:1 vs British pounds; 100:1 and non-intuitive 93:1/107:1 vs 1:1
  design: Incentivised RCT; BDM willingness-to-pay for 16 risky/ambiguous lotteries standing in for loot boxes; between-subjects currency conditions
  setting: Online experiment, 753 UK Prolific participants
  outcome: Normalised willingness to pay
  result_kind: Context-dependent
  result: WTP ~4.0-4.2% higher in virtual currency at 1:1 than in pounds (16 of 16 lotteries higher, sign test p<0.001); WTP ~4% lower at 100:1 than at 1:1; no significant difference between non-intuitive (93:1, 107:1) and intuitive 100:1 rates (<1%)
  boundary: Loot-box lotteries, not AI credits or subscriptions; the exchange-rate effect runs opposite to a naive "confusing rate always raises spending" story — a high nominal number made items feel more expensive, so the vendor-set rate matters through numerosity, not just obscurity; stated WTP, not field spending
  source: https://www.cambridge.org/core/journals/experimental-economics/article/virtual-currencies-in-online-gaming-increase-the-willingness-to-pay-for-loot-boxes-an-experimental-analysis/BA5773D9B866AF75DF978A1410E37B1F

  outcome: perceived fairness, revisit intention, ad engagement
  result_kind: Negative
  result: Even a one-cent surcharge on a complimentary item reduced perceived fairness and revisit intention and lowered ad engagement; the paper notes prior work focused on larger magnitudes (e.g. ~20% of total) and small surcharges were thought to be ignored or demand-increasing (Morwitz et al. 1998; Chakravarti et al. 2002), with negative effects mainly when surcharges were large relative to base (Sheng et al. 2007).

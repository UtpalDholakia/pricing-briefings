- id: mazumdar-reference-price-review-2005
  date: '2005-10-01'
  mechanism: Consumers judge a sale price against an internal reference price built from prices previously paid and seen; when earlier hikes have moved that benchmark up, a festival discount measured off the old price no longer reads as a gain.
  mechanism_codes:
  - reference-price
  comparison: Synthesis of behavioural experiments and panel-data reference-price models
  design: Integrative literature review with testable propositions on reference-price formation, retrieval/use, and effects on choice and evaluation
  setting: General consumer markets (review)
  outcome: Internal reference price formation and updating; price judgments and purchase decisions
  result_kind: Positive in this setting
  result: Reference prices are updated through accumulated price observations and purchase experiences (adaptation-level theory); advertised/external reference prices assimilate into the internal reference, raising it; prior purchase history is a key antecedent.
  boundary: A review, not a new experiment; it establishes the mechanism (reference updating) rather than testing festival discounts after hikes specifically.

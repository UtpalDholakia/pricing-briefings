- jurisdiction: US federal (FTC)
  topic: Personalized pricing
  approach: Policy statement + 6(b) study
  scope: 'Proposed policy: undisclosed personalized pricing may be deceptive where buyers expect one price'
  carve_outs: ''
  status: Policy proposed Aug 2026, not final; 6(b) responses due mid-Dec
  effective: ''

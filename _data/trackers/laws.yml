- jurisdiction: European Union
  topic: Reference prices, drip pricing, dynamic pricing, virtual currencies
  approach: Blacklist + disclosure
  scope: Reference-price claims and drip pricing on per-se blacklist; real-money values for in-game currency; max-price disclosure for dynamic event ticketing; active consent before free trials convert
  carve_outs: Personalized pricing banned only where profiling harms minors or vulnerable consumers
  status: Commission proposal Nov 11, 2026
  effective: Unlikely before 2028
  source: https://www.freshfields.com/en/our-thinking/briefings/2026/11/digital-fairness-act-the-eus-new-consumer-protection-rulebook-takes-shape
  updated: '2026-11-14'
- jurisdiction: United Kingdom (CMA, DMCC Act)
  topic: Drip pricing and fees
  approach: All-in pricing with fines
  scope: Mandatory fees, incl. delivery, in headline price at every step; marketplaces include each seller's delivery charge
  carve_outs: ''
  status: Enforced; £5.1m+ in drip-pricing fines
  effective: In force; subscription regime from Jan 2027
  source: https://www.lewissilkin.com/insights/2026/11/03/cma-issues-warning-to-online-retailers-about-delivery-fees-102o7ck
  updated: '2026-11-06'

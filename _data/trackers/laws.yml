# Tracker: laws. Newest first. Edit by appending entries; see AGENTS.md section 6.
- jurisdiction: New York City
  topic: Personalized pricing
  approach: Ban
  scope: Algorithmic prices using personal data to charge different people different prices; online and in-store; fines up to $1,000 per transaction
  carve_outs: Stated-trait discounts (e.g. veterans); loyalty tiers based on own purchase history; no inferred traits; marketplaces may not use purchase history to set reference prices
  status: Passed Nov 12, 2026; awaits mayor
  effective: One year after signing
  source: https://dataprivacy.foxrothschild.com/2026/11/articles/general-privacy-data-security-news-developments/new-york-city-council-passes-surveillance-pricing-ban/
  updated: '2026-11-15'
- jurisdiction: Seattle
  topic: Personalized pricing
  approach: Ban
  scope: Algorithmic price discrimination; reaches electronic shelf labels
  carve_outs: Purchase-history discounts only if offered to groups; group size set by rulemaking (~March 2027)
  status: Signed Oct 5, 2026
  effective: Sept 2027
  source: https://kiro7.com/news/local/kiro-7-investigates-seattle-bans-surveillance-pricing-will-shoppers-lose-discounts/XAJH2NM7EZCW5N436Q2QIFBA6U
  updated: '2026-11-04'
- jurisdiction: Maryland

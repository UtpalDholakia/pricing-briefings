- case_id: texas-ticket-all-in-2027
  jurisdiction: Texas
  topic: Ticket pricing (all-in price display; no increase after selection)
  approach: Disclosure mandate
  scope: 'Websites and apps selling or reselling tickets to Texas events must show the total price including mandatory fees in the listing, with the fee amount, and may not raise the total after the buyer selects a ticket (except a disclosed charge for non-electronic delivery the buyer chooses)'

- id: ttc-fare-cap
  offer: Toronto Transit Commission monthly fare
  announced: '2026-08-13'
  from_model: Pay per trip or buy an eligible monthly pass upfront
  to_model: Pay per trip with an automatic monthly cap on the same payment method
  new_customers: Eligible customers using the same card or device reach the 2026 cap after 47 paid trips.
  existing_customers: Selected monthly passes ended. Adult 12-month and post-secondary pass arrangements are distinct and not assumed to migrate.
  first_bill_timing: The cap applied from Sep 1, 2026. No subscription renewal is required to receive it.
  status: Provider-reported outcome
  observed_outcome: TTC reported 595,000 no-charge trips after riders reached the cap in September. That count does not establish additional demand caused by the change.
  outcome_source: https://www.ttc.ca/news/2026/October/TTC-customers-save-nearly-%242-million-in-first-month-of-fare-capping-program
  next_check: '2026-12-15'
  question: Watch the cap at New Year and compare frequent riders who use one payment method against the fixed panel profiles.
  panel_ids: [ttc-30-trips, ttc-50-trips]
  source: https://www.ttc.ca/news/2026/August/TTC-monthly-fare-capping-launches-September-1

- id: sharetribe-usage-credits
  offer: Sharetribe marketplace plans
  announced: '2026-10'
  from_model: Lite, Pro or Extend plan plus transaction-volume charges
  to_model: One Live operating plan for new customers plus infrastructure usage credits
  new_customers: New live marketplaces choose the Live plan. The included monthly credits and usage above the allowance are separate from the base rate.
  existing_customers: Existing Lite customers can keep the base plan. The transition to the new usage meter is separate and also affects existing customers.
  first_bill_timing: The transition guide flags December for usage charges above the included credits. Announcement date is recorded at month precision.
  status: Terms published
  next_check: '2026-12-15'
  question: How does the first usage bill differ for a marketplace with many conversations but few completed transactions?
  source: https://www.sharetribe.com/help/en/articles/17106763-legacy-plans-and-pricing-transition-timeline
  updates:

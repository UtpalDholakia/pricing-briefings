- hypothesis_id: matched-price-deals-sell-like-lows
  hypothesis: Shoppers buy a Black Friday deal at the same rate whether its price is the year's lowest or only matches an earlier price, because few check price history and the "was" price does the work.
  predicts: Sell-through of matched-price deals is statistically indistinguishable from that of genuine year-low deals in the same category and retailer.
  test: 'Compare unit sales (or sales rank changes) of matched-price versus genuine-low products in a price-history audit sample such as Which?''s Black Friday sample, holding category and retailer fixed; a retailer or marketplace dataset with deal badges and price histories would be stronger. A difference in favour of genuine lows would count against it.'

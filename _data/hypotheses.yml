  test: 'A field or lab market with AI buyers of varying accuracy, measuring consumer surplus rather than seller revenue. Hunt for a real test, not more simulations: the source simulation (ning-ai-buyer-disclosure-2026) is flagged as not robust.'
  status: Testing
  confidence: Low

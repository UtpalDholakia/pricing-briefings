- hypothesis_id: churn-is-about-options
  hypothesis: Subscription churn after a price rise comes as much from missing pause or downgrade options as from price sensitivity.
  predicts: Risers offered pause or downgrade churn less than risers offered only cancel, at the same price rise.
  test: Paid retention (not just cancellations) for risers offered pause, offered downgrade, and offered only cancel, at the same price rise; count paused but unpaid accounts as unpaid at day 90. Showing that options matter as much as price sensitivity needs the price rise varied too. The one existing pointer (subscription-unbundling-survey-2026) is weak-fit and is not evidence.
  status: Testing
  confidence: Low
  lanes:

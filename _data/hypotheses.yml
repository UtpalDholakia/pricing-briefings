- hypothesis_id: labour-cost-fairer-than-material
  hypothesis: A price rise blamed on labour costs is judged fairer than the same rise blamed on material costs.
  predicts: Fairness ratings for an identical rise are higher when labour costs are named than when material costs are.
  test: A vignette experiment ranking justifications (labour, materials, energy, demand) for an identical rise with an equally credible cost, testing whether the result depends on who shoppers think receives the extra money.
  status: Graduated
  confidence: Low
  lanes:
  - Industries the others ignore
  - Meta-platform consumer voice
  last_hunted: null
  hunt_count: 0
  hunts: []
  evidence_for:
  - kind: evidence
    ref: bagchi-labour-vs-material-cost-justification
    note: 'Direct test: Goenka & Bagchi (MSI WP 24-121; the seminar is the same program). Study 1A: labour 4.97, materials 4.61, none 3.67 (7-point); gap 0.36, CI [0.04, 0.67], per ChatGPT''s reading. Depends on who benefits.'
  - kind: evidence
    ref: stangl-cost-structure-appeals-fairness-2026
    note: 'Context: naming customer-facing (staff) costs beat overheads; alignability, not labour vs materials.'
  - kind: evidence
    ref: vaidyanathan-aggarwal-attribution-fairness-2003
    note: 'Context: costs seen as outside the seller''s control are judged fairer; whether wages are seen that way is untested.'

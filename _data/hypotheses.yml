- hypothesis_id: restraint-pays-for-monopolists
  hypothesis: A near-monopolist that restrains its price (modest rises, two-part tariffs) earns more in the long run than one that exploits its position.
  predicts: Dominant sellers with restrained rises show better multi-year revenue and retention than comparable dominant sellers with exploitative rises.
  test: A comparison among similarly dominant sellers, with market power measured, over a stated horizon, reporting revenue and profit separately (the TSMC overage-surcharge case once filed is one input). A modest rise by a seller without market power does not test it.
  status: Testing

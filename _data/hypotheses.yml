  predicts: Fairness ratings of the same scheme fall more when the worst-case outcome is highlighted than when the median is.
  test: A survey presenting the same pricing scheme with the median outcome versus the worst-case outcome highlighted, measuring fairness judgments.
  status: Testing
  confidence: Low

  predicts: Dominant sellers with restrained rises show better multi-year revenue and retention than comparable dominant sellers with exploitative rises.
  test: The TSMC overage-surcharge case once filed, plus a comparison of restrained versus exploitative rises by dominant sellers in explanations.yml.
  status: Testing
  confidence: Low

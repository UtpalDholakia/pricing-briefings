- hypothesis_id: fairness-judged-by-worst-hit
  hypothesis: The public judges personalised pricing by the worst-hit shopper, not by the median shopper.
  predicts: Fairness ratings of the same scheme fall more when the worst-case outcome is highlighted than when the median is.
  test: The same pricing scheme with the median outcome highlighted, the worst case highlighted, and no highlight; the no-highlight condition shows which outcome people focus on unprompted.
  status: Testing
  confidence: Low
  lanes:
  - Outside the US/UK/EU
  - Meta-platform consumer voice
  last_hunted: '2026-11-20'

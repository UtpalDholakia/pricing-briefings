- claim_id: small-surcharge-partitioning-helps
  claim: Showing a surcharge separately from the base price raises purchase intention only while the surcharge is small relative to the base price.
  status: Open
  confidence: Low
  confidence_note: 'Three tests kept separate. (1) Itemised vs all-in at the same total, the direct test: Aichner & Dorigati support the size boundary; Morwitz shows partitioning helps at moderate size without a size contrast. (2) Early vs late disclosure (Santana, Blake): drip pricing, boundary only. (3) Unexpected charge vs no charge (Lee): boundary, not a partitioning comparison. Sheng varies surcharge size without an all-in comparator. Abraham & Hamilton''s meta-analysis adds typicality, perceived benefit and total-price visibility as moderators; it pools Morwitz and others, so it is not counted again. Lean for, one direct test; Low.'
  mechanism_codes:
  - partitioned-pricing
  - drip-pricing
  created: '2026-11-17'
  last_updated: '2026-11-26'
  evidence_for:
  - kind: evidence
    ref: partitioned-surcharge-magnitude
    note: 'Direct test (itemised vs all-in, same total, small vs large fee): partitioning helped with a small fee and hurt with a large one; n=433, stated intentions.'
  - kind: evidence
    ref: morwitz-partitioned-prices-1998
    note: Direct test of itemised vs all-in at the same total (moderate surcharges, ~15-18% of base); no size contrast. Pooled in Abraham & Hamilton.
  - kind: evidence
    ref: sheng-surcharge-fairness-2007
    note: 'Boundary: the same surcharge judged unfair on a small base, fair on a large one; no all-in comparator.'
  - kind: evidence
    ref: santana-drip-pricing-2020
    note: 'Boundary (early vs late disclosure): drip surcharges steered choice; timing, not size.'
  - kind: evidence
    ref: blake-stubhub-drip-2021
    note: 'Boundary (early vs late disclosure): checkout-only fees raised completion 14.1%; timing, not size.'
  - kind: evidence
    ref: abraham-hamilton-partitioned-pricing-meta-2018
    note: 'Context (meta-analysis, 149 observations): partitioning helps when the total is absent and the surcharge is typical and beneficial; pools studies filed separately, so not counted again.'
  evidence_against:
  - kind: evidence
    ref: lee-unexpected-surcharge-2026
    note: 'Boundary (unexpected charge vs no charge): a one-cent surcharge on a complimentary item cut fairness; not an itemised vs all-in comparison.'
  - kind: evidence
    ref: goenka-bagchi-sociomoral-partitioning-3c-2024
    note: 'Boundary (itemised vs all-in at the same total; purpose varied, size not): separating a carbon-offset fee cut choice share from 40.1% to 27.6%, while separating a shipping fee left it at 40.1%. Purpose of the fee, not only its size, conditions the effect; suggested by ChatGPT, 2026-11-24.'
  - kind: evidence
    ref: lee-free-shipping-small-fee-2026
    note: 'Boundary (free vs KRW2,000 shipping at a fixed KRW50,000 total; within-person lab task, N=38): purchase intention 2.57 vs 2.55, not significant, so a small partitioned fee did not raise intention here; the composite RIS measure did differ. Not a test of size, since size was not varied; suggested by ChatGPT, 2026-11-25.'
  related_questions: []
  related_dives: []
  status_history:
  - date: '2026-11-17'
    old_status: null
    new_status: Contested
    reason: Lab evidence for the size boundary; field cases where small, poorly labelled fees still provoked backlash.
    source: https://utpaldholakia.github.io/pricing-briefings/briefings/2026-11-17-claude/
    proposed_by: claude
    confirmed_by: null
  - date: '2026-11-17'
    old_status: Contested
    new_status: Open
    reason: 'Review before confirmation: the two restaurant cases are drip pricing (fees revealed late), not tests of upfront partitioning, so they were removed as counter-evidence; one study for is not enough for Supported.'
    source: https://utpaldholakia.github.io/pricing-briefings/claims/#small-surcharge-partitioning-helps
    proposed_by: claude
    confirmed_by: null
  - date: '2026-11-18'
    old_status: Open
    new_status: Contested
    reason: 'Proposed after the 2026-11-18 backfill: partitioning studies support a size boundary (Morwitz 1998, Sheng 2007), while Lee et al. (2026) found even a trivial surcharge on a complimentary item cut fairness.'
    source: null
    proposed_by: claude
    confirmed_by: null
  - date: '2026-11-18'
    old_status: Contested
    new_status: Open
    reason: 'Proposal withdrawn after ChatGPT audit of 3456647 (2026-11-18): the pointers mix three different tests (itemised vs all-in at the same total; early vs late disclosure; an unexpected charge vs none). Only the first tests the claim directly, and the one direct test supports it.'
    source: null
    proposed_by: claude
    confirmed_by: null

    note: 'Context (vendor data, US 2026): about 1 in 8 products, and 1 in 3 electronics, rose in price between early September and late October; for 2025, 6 in 10 marked-up products were no cheaper on Black Friday than in September. A share of marked-up products, not of advertised deals, so not counted on A or B.'
  - kind: evidence

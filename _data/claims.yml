    reason: 'Proposed after the 2026-11-18 backfill and Claude''s sweep: lab and incentivised studies show intermediate currencies shift willingness to pay and choice (incl. Hsee et al. 2003), but with rates disclosed one study found no effect and field cases suggest buyers notice credit changes.'
    source: null

- claim_id: cost-naming-reduces-backlash
  claim: Naming a specific cost in a price-rise explanation reduces backlash compared with an unspecified or market-based explanation.
  status: Contested
  confidence: Low
  confidence_note: 'Proposed Contested (awaiting Utpal). Lab and vignette studies for; one field experiment and two attribution studies against or bounding. Likely boundary: naming a cost helps when buyers see it as outside the seller''s control.'
  mechanism_codes:
  - dual-entitlement
  - motive-attribution
  - price-change-communication
  created: '2026-11-17'
  last_updated: '2026-11-18'
  evidence_for:
  - kind: evidence
    ref: kahneman-knetsch-thaler-dual-entitlement-1986
    note: Cost pass-through judged acceptable (79%), demand exploitation unfair (82%); vignettes.
  - kind: evidence
    ref: urbany-cost-justification-atm-surcharge-1989
    note: Surcharge fair to 58% when cost-justified vs 29% unjustified; n=40, and judgments did not predict behaviour.
  - kind: evidence
    ref: campbell-inferred-motive-price-unfairness-1999
    note: Negative inferred motive made the same rise less fair; motive inferred, not stated.
  - kind: evidence
    ref: tarrahi-meta-analysis-price-change-fairness-2016
    note: 'Meta-analysis (54 samples): bad motives hurt more than cost justifications help; size of rise matters more than motive.'
  - kind: evidence
    ref: stangl-cost-structure-appeals-fairness-2026
    note: Naming customer-facing costs raised fairness and voluntary payments (2 field + 6 lab); mostly pay-what-you-want, not list-price rises.
  evidence_against:
  - kind: tracker
    ref: damavandi-justification-study
    note: 'Field experiment (J. Marketing): only market (scarce-alternatives) justifications reduced attrition; cost and quality justifications did not.'
  - kind: tracker
    ref: sam-fender-tour-2026
    note: 'Anecdote, not a comparison: a cost-tracking explanation still met fan backlash; prices partly reversed.'
  - kind: evidence
    ref: vaidyanathan-aggarwal-attribution-fairness-2003
    note: 'Experiments: cost-justified rises judged less fair when the cost was within the seller''s control or rivals held prices; naming a cost is not enough.'
  - kind: evidence
    ref: bolton-warlop-alba-price-unfairness-2003
    note: 'Experiments: cueing sellers'' costs improved fairness judgments only modestly.'
  related_questions:
  - tariff-refund-expectations-2026
  related_dives: []
  status_history:
  - date: '2026-11-17'
    old_status: null
    new_status: Contested
    reason: One field experiment and one field case against; nothing for.
    source: https://utpaldholakia.github.io/pricing-briefings/trackers/#explanations
    proposed_by: claude
    confirmed_by: null
  - date: '2026-11-17'
    old_status: Contested
    new_status: Open
    reason: 'Review before confirmation: Contested needs credible evidence on both sides. Evidence only against, from one study of uncertain fit plus an anecdote, is short of Refuted, so Open with the lean noted (rule clarified in AGENTS.md section 12).'
    source: https://utpaldholakia.github.io/pricing-briefings/claims/#cost-naming-reduces-backlash
    proposed_by: claude
    confirmed_by: null
  - date: '2026-11-18'
    old_status: Open
    new_status: Contested
    reason: 'Proposed after the 2026-11-18 backfill and Claude''s sweep: vignette and lab studies find cost justifications raise fairness, while the one field test found cost justifications did not cut attrition, and attribution studies show a named cost helps only when it is outside the seller''s control (Vaidyanathan & Aggarwal 2003) and cost cues help only modestly (Bolton, Warlop & Alba 2003).'
    source: null
    proposed_by: claude
    confirmed_by: null
  agent: claude
- claim_id: credits-obscure-true-price
  claim: When a vendor prices in credits rather than currency, buyers underestimate what they pay, because the vendor sets the exchange rate.
  status: Contested
  confidence: Low
  confidence_note: 'Proposed Contested (awaiting Utpal). Studies of intermediate currencies find distortion; a disclosed-rate null and AI-product field cases point the other way. No study yet measures whether AI-credit buyers misjudge spend. Added 2026-11-18 (ChatGPT audit): two boundary studies show exchange-rate design changes behaviour; neither measures whether credit buyers misjudge their bills, which remains the missing direct test.'
  mechanism_codes:
  - mental-accounting
  - usage-anxiety
  created: '2026-11-17'
  last_updated: '2026-11-27'
  evidence_for:
  - kind: tracker
    ref: openai-gpt-6-2-billing-fix-2026
    note: 'Context: the vendor re-counted how much usage each GPT-6.2 request draws, so ChatGPT limits arrive 40% (Astra) or 25% (Sol) sooner at an unchanged price; shows the vendor controls the conversion rate, but measures nothing about whether buyers misjudge spend.'
  - kind: tracker
    ref: chatgpt-pro-allowance-2026
    note: Allowance cut announced at an unchanged price, framed as efficiency (later cancelled).
  - kind: tracker
    ref: notion-credits-2026
    note: Two non-interchangeable credit balances with a fixed draw-down order.
  - kind: evidence
    ref: virtual-currency-loot-box-wtp-2025
    note: Virtual currency at 1:1 raised WTP ~4% vs pounds (incentivised RCT, N=753); a 100:1 rate lowered it.
  - kind: evidence
    ref: monopoly-money-scrip-spending-2008
    note: Scrip and gift certificates spent more freely than equal cash; itemising closed the gap.
  - kind: evidence
    ref: numerosity-virtual-item-price-salience-2021
    note: 'Direction flips with exchange-rate salience: high numbers feel dearer when the rate is hidden, cheaper when shown.'
  - kind: evidence
    ref: hsee-medium-maximization-points-2003
    note: 'Lab: an intermediate medium (points) distorts choice toward more points over better outcomes; mechanism, not misjudged spend.'
  - kind: evidence
    ref: raghubir-srivastava-face-value-2002
    note: 'Boundary: unfamiliar currencies bias valuation toward face value; over- or underspending depending on denomination. No AI bill-forecast measure.'
  - kind: evidence
    ref: chun-hamilton-variable-points-exchange-rate-2024
    note: 'Boundary: a variable points rate (same average value) cut redemption. Loyalty points, not usage credits; no bill-forecast measure.'
  - kind: tracker
    ref: teamwork-ai-credits-2026
    note: 'Context: a published price per credit ($0.01 top-ups) but no published credits per AI action, pooled at account level and expiring monthly; an instance of the vendor-set exchange rate, not a test of buyer misjudgment.'
  - kind: tracker
    ref: clickup-ai-credits-2026
    note: 'Context: AI add-ons with dollar prices ($9, $28) replaced by pooled plan credits with no published credits per action; the currency price became a credit allowance. An instance, not a test of misjudged spend.'
  - kind: tracker
    ref: hubspot-agent-credits-2026
    note: 'Context: credits priced at $10 per 1,000 but credits per agent action unpublished, so the dollar cost of agent work is not knowable in advance. An instance, not a test.'
  - kind: tracker
    ref: xai-x-subscription-2026
    note: 'Context: xAI''s X Subscription puts Grok, Grok Bot and Cursor on one weekly pool with unpublished sizes, then tightened Grok Bot limits at unchanged prices (xai-grok-bot-limits-2026); shows the vendor setting the exchange rate between work and allowance, but measures nothing about buyer misjudgement.'
  evidence_against:
  - kind: tracker
    ref: openai-per-job-pricing-2026
    note: Buyers rejected a simpler flat per-job price in favour of auditable token metering.
  - kind: tracker
    ref: genai-subscriptions-nber-2026
    note: 'Card data on 174M consumers: high churn and switching suggest buyers respond to value changes.'
  - kind: evidence
    ref: free-to-play-currency-conversion-null-2018
    note: With rates disclosed, currency conversion did not raise spending (N=21).
  related_questions: []
  related_dives:
  - 2026-12-credits-as-a-currency
  status_history:
  - date: '2026-11-17'
    old_status: null
    new_status: Open
    reason: Cases and an argument, but no direct test of underestimation; indirect evidence on both sides.
    source: https://utpaldholakia.github.io/pricing-briefings/cases/2026-12-credits-as-a-currency/
    proposed_by: claude
    confirmed_by: null
  - date: '2026-11-18'

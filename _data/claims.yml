- claim_id: most-black-friday-deals-not-discounts
  claim: Most advertised Black Friday "deals" are not discounts against the product's own price history.
  status: Open
  confidence: Medium
  confidence_note: 'Three measures kept apart. (A) Below a prior benchmark: Groundwork (Amazon US, 351 deals; ties count as no discount): 57.3% no cheaper than the 90-day low, 29.1% vs 30 days; Shoprime (Brazil, 5,812 offers; within +/-5% of typical counts as no discount): 30.3% more than 5% below typical; Idealo (Germany, >10,000 products, second-hand): 73% below the October level. (B) Tied with or beaten by a price outside the event: Which? (UK, 175 products, +/-6 months; ties count): 83%; Idealo: 59% cheaper on another November day. (C) Compliance with the EU 30-day rule: EU sweep, about 30% of 314 traders (a share of traders, not products); DECO instances. On (A) the evidence is mixed and depends on the window; on (B) both measures say most deals are matched or beaten. Suggested split wording: ''Most advertised Black Friday prices are matched or beaten at another time of year'' (B), kept apart from ''Most are no lower than the product''s recent low'' (A). Awaiting Utpal.'
  mechanism_codes:
  - reference-price

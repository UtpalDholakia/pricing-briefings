    note: 'Context (vendor data, Norway 2026): early in Black Week, 29% of about 1,000 popular products were still at least 5% dearer than in early September and about 23% at least 5% cheaper. A share of tracked products, measured before most offers, not of advertised deals, so not counted on A or B.'

- claim_id: small-surcharge-partitioning-helps
  claim: Showing a surcharge separately from the base price raises purchase intention only while the surcharge is small relative to the base price.
  status: Open
  confidence: Low
  confidence_note: 'One experiment supports the size boundary. Restaurant fee backlash (earls-admin-fee-2026, uca-terraza-fees-2026) was removed as counter-evidence on 2026-11-17: those fees were revealed late (drip pricing), which does not test an upfront partitioned price against an all-in one. A field comparison of upfront partitioned and all-in prices is needed.'
  mechanism_codes:
  - partitioned-pricing
  - drip-pricing
  created: '2026-11-17'
  last_updated: '2026-11-17'
  evidence_for:

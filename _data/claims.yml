  mechanism_codes:
  - price-change-communication
  - motive-attribution
  created: '2026-11-17'
  last_updated: '2026-11-21'
  evidence_for:
  - kind: tracker
    ref: valve-cs2-sticker-pricing-2026
    note: 'Context (fees or terms changed): Valve dropped demand-based sticker pricing for the next Major after widely covered ridicule; earlier Cologne stickers were not repriced.'

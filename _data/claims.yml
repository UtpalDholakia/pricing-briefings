    old_status: null
    new_status: Contested
    reason: Most resolved cases reversed, but two widely covered cases held, and the tracker cannot yet separate public from private backlash.
    source: https://utpaldholakia.github.io/pricing-briefings/trackers/#backlash
    proposed_by: claude
    confirmed_by: null
  agent: claude
- claim_id: cost-naming-reduces-backlash
  claim: Naming a specific cost in a price-rise explanation reduces backlash compared with an unspecified or market-based explanation.
  status: Open
  confidence: Low
  confidence_note: Leans against. The only direct test in the repo, a field experiment, found market justifications cut attrition and cost justifications did not; whether its cost condition named a specific cost is unconfirmed. No evidence for yet; tariff refunds suggest a named cost may also bind the seller later.
  mechanism_codes:
  - dual-entitlement
  - motive-attribution
  - price-change-communication
  created: '2026-11-17'
  last_updated: '2026-11-17'
  evidence_for: []
  evidence_against:
  - kind: tracker
    ref: damavandi-justification-study
    note: 'Field experiment (J. Marketing): only market (scarce-alternatives) justifications reduced attrition; cost and quality justifications did not.'
  - kind: tracker
    ref: sam-fender-tour-2026
    note: 'Anecdote, not a comparison: a cost-tracking explanation still met fan backlash; prices partly reversed.'
  related_questions:
  - tariff-refund-expectations-2026
  related_dives: []
  status_history:
  - date: '2026-11-17'
    old_status: null
    new_status: Contested
    reason: One field experiment and one field case against; nothing for.
    source: https://utpaldholakia.github.io/pricing-briefings/trackers/#explanations
    proposed_by: claude
    confirmed_by: null
  - date: '2026-11-17'
    old_status: Contested
    new_status: Open
    reason: 'Review before confirmation: Contested needs credible evidence on both sides. Evidence only against, from one study of uncertain fit plus an anecdote, is short of Refuted, so Open with the lean noted (rule clarified in AGENTS.md section 12).'
    source: https://utpaldholakia.github.io/pricing-briefings/claims/#cost-naming-reduces-backlash
    proposed_by: claude
    confirmed_by: null
  agent: claude
- claim_id: credits-obscure-true-price
  claim: When a vendor prices in credits rather than currency, buyers underestimate what they pay, because the vendor sets the exchange rate.
  status: Open
  confidence: Low
  confidence_note: The repo has cases where the exchange rate changed (allowances, credit draw-down rules) but no measurement of whether buyers misjudged what they paid; churn data and the per-job reversal suggest buyers notice and prefer metered units. The draft deep dive was removed from the evidence on 2026-11-17 (an argument for the claim is not evidence for it) and stays under related dives.
  mechanism_codes:
  - mental-accounting
  - usage-anxiety
  created: '2026-11-17'
  last_updated: '2026-11-17'
  evidence_for:
  - kind: tracker
    ref: chatgpt-pro-allowance-2026
    note: Allowance cut announced at an unchanged price, framed as efficiency (later cancelled).
  - kind: tracker
    ref: notion-credits-2026
    note: Two non-interchangeable credit balances with a fixed draw-down order.
  evidence_against:
  - kind: tracker
    ref: openai-per-job-pricing-2026

- claim_id: divisible-multipacks-sell-better
  claim: Multipack prices that divide easily (4 for $16) are chosen more often than equivalent prices that are hard to divide (4 for $15.30).
  status: Refuted
  confidence: Medium
  confidence_note: Four replications failed to reproduce the original effect; this refutes the multipack result, not the broader idea that easier arithmetic can affect choice.
  mechanism_codes:
  - unit-price-processing
  created: '2026-11-17'
  last_updated: '2026-11-17'
  evidence_for: []
  evidence_against:
  - kind: evidence
    ref: divisibility-replication
    note: None of four replications reproduced the original result.
  related_questions: []
  related_dives: []
  status_history:
  - date: '2026-11-17'
    old_status: null
    new_status: Refuted
    reason: Direct replications failed (verdict rule D.3).
    source: https://experts.umn.edu/en/publications/brief-commentary-is-4-for-16-better-than-4-for-1530-testing-the-r/
    proposed_by: claude
    confirmed_by: null
  agent: claude

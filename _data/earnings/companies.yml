# Earnings pricing watch: the companies whose earnings calls are read for pricing. AGENTS.md section 15.
# tier 1 = read every quarter; tier 2 = read when time allows, and always when the company makes pricing news.
# metric = the label the company usually uses for its price effect. It is a hint for where to look:
#   always record the label the company actually used that quarter, in earnings_pricing.yml.
# firm_id links to _data/firms.yml where the firm is already registered.
# Only Utpal adds or removes companies; agents may suggest additions in their briefings.

